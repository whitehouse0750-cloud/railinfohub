<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailInfoHub - Live Train Status</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;text-align:center}
header{background:#0b3d91;color:white;padding:20px}
main{max-width:500px;margin:30px auto;padding:20px}
input,button{padding:14px;margin:5px;border-radius:8px;border:1px solid #ddd}
button{background:#ff7a00;color:white;border:0;font-weight:bold}
#result{margin-top:20px;background:white;padding:20px;border-radius:12px}
</style>
</head>
<body>

<header>
<h1>🚆 RailInfoHub</h1>
<p>Live Train Status | लाइव ट्रेन स्टेटस</p>
</header>

<main>
<h2>Check Train Status</h2>

<input id="train" type="number" placeholder="Train Number / ट्रेन नंबर">

<button onclick="checkTrain()">Search</button>

<div id="result">Train number डालकर Search करें</div>
</main>

<script>
async function checkTrain(){

let train=document.getElementById("train").value;
let result=document.getElementById("result");

if(!train){
result.innerHTML="कृपया Train Number डालें";
return;
}

result.innerHTML="⏳ Live status खोज रहे हैं...";

try{

let response=await fetch(
"https://railinfohub-api.whitehouse0750.workers.dev/live?train="+train
);

let data=await response.json();

result.innerHTML="<pre style='white-space:pre-wrap;text-align:left'>"+
JSON.stringify(data,null,2)+
"</pre>";

}catch(error){

result.innerHTML="❌ Live status नहीं मिल पाया। कृपया फिर कोशिश करें।";

}

}
</script>

</body>
</html>
