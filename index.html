<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RailInfoHub - Live Train Status</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f1f5fb;
  color:#172033;
}

.header{
  background:#064fa8;
  color:white;
  text-align:center;
  padding:28px 15px;
}

.header h1{
  font-size:32px;
  margin-bottom:8px;
}

.header p{
  font-size:17px;
}

.hero{
  background:linear-gradient(135deg,#0867d5,#0752a8);
  padding:45px 20px;
  text-align:center;
  color:white;
}

.hero h2{
  font-size:32px;
  margin-bottom:10px;
}

.hero p{
  font-size:18px;
  margin-bottom:28px;
}

.search-box{
  max-width:600px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:18px;
}

.search-box input{
  width:100%;
  padding:18px;
  font-size:20px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  margin-bottom:12px;
}

.search-box button{
  width:100%;
  padding:17px;
  background:#ff7900;
  color:white;
  border:none;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.search-box button:active{
  transform:scale(.98);
}

.container{
  max-width:850px;
  margin:30px auto;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.train-title{
  color:#0752a8;
  font-size:28px;
  font-weight:bold;
  margin-bottom:8px;
}

.train-number{
  font-size:18px;
  color:#555;
  margin-bottom:20px;
}

.status{
  padding:15px;
  background:#e5f8e9;
  color:#167333;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  margin-bottom:20px;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.info{
  background:#f4f7fc;
  padding:18px;
  border-radius:12px;
}

.info small{
  display:block;
  color:#666;
  margin-bottom:5px;
}

.info strong{
  font-size:19px;
}

.section-title{
  font-size:23px;
  color:#0752a8;
  margin-bottom:15px;
}

.station{
  border-left:5px solid #0b68d1;
  background:#f7f9fd;
  padding:16px;
  margin-bottom:12px;
  border-radius:8px;
}

.station.current{
  border-left-color:#ff7900;
  background:#fff4e8;
}

.station-name{
  font-size:19px;
  font-weight:bold;
}

.station-code{
  color:#666;
  margin-top:4px;
}

.station-time{
  margin-top:8px;
  font-size:15px;
}

.delay{
  color:#e53935;
  font-weight:bold;
}

.loading{
  text-align:center;
  padding:25px;
  font-size:18px;
  color:#0752a8;
}

.error{
  background:#ffe7e7;
  color:#b00020;
  padding:18px;
  border-radius:12px;
  font-weight:bold;
  text-align:center;
}

footer{
  text-align:center;
  padding:30px;
  color:#666;
}

@media(max-width:600px){

  .header h1{
    font-size:27px;
  }

  .hero h2{
    font-size:27px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .card{
    padding:20px;
  }

  .train-title{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>🚆 RailInfoHub</h1>
  <p>Indian Railway Information | भारतीय रेलवे जानकारी</p>
</header>

<section class="hero">

  <h2>Train Information</h2>
  <p>Find train information quickly and easily</p>

  <div class="search-box">

    <input
      id="trainNumber"
      type="number"
      placeholder="Enter Train Number / ट्रेन नंबर"
    >

    <button onclick="searchTrain()">
      Search
    </button>

  </div>

</section>

<main class="container">

  <div id="result"></div>

</main>

<footer>
  © 2026 RailInfoHub
</footer>


<script>

const API_URL =
"https://railinfohub-api.whitehouse0750.workers.dev/live?train=";


async function searchTrain(){

  const input =
    document.getElementById("trainNumber");

  const train =
    input.value.trim();

  const result =
    document.getElementById("result");


  if(!train){

    result.innerHTML =
      '<div class="error">कृपया ट्रेन नंबर डालें।</div>';

    return;
  }


  result.innerHTML =
    '<div class="card loading">⏳ Live train data लोड हो रहा है...</div>';


  try{

    const response =
      await fetch(API_URL + encodeURIComponent(train));


    if(!response.ok){

      throw new Error(
        "API response error: " + response.status
      );

    }


    const json =
      await response.json();


    if(!json.success || !json.data){

      throw new Error("Train data नहीं मिला");

    }


    const data =
      json.data;


    displayTrain(data);


  }catch(error){

    console.error(error);

    result.innerHTML = `
      <div class="card">
        <div class="error">
          ❌ Live status नहीं मिल पाया।<br><br>
          कृपया ट्रेन नंबर सही डालकर फिर कोशिश करें।
        </div>
      </div>
    `;

  }

}


function displayTrain(data){

  const result =
    document.getElementById("result");


  const trainNumber =
    data.trainNumber || "-";

  const trainName =
    data.trainName || "Train";


  const currentStation =
    data.currentStationName ||
    data.currentStation ||
    "-";


  const currentCode =
    data.currentStationCode ||
    data.stationCode ||
    "";


  const delay =
    data.delay || 0;


  let delayText =
    "On Time";


  if(Number(delay) > 0){

    delayText =
      delay + " min late";

  }


  let stationsHTML = "";


  if(Array.isArray(data.stations)){

    data.stations.forEach((station)=>{

      const name =
        station.stationName ||
        station.name ||
        "-";


      const code =
        station.stationCode ||
        station.code ||
        "";


      const arrival =
        station.actualArrival ||
        station.scheduledArrival ||
        "-";


      const departure =
        station.actualDeparture ||
        station.scheduledDeparture ||
        "-";


      const status =
        station.status ||
        "";


      const isCurrent =
        (
          name === currentStation ||
          code === currentCode
        );


      stationsHTML += `

        <div class="station ${isCurrent ? "current" : ""}">

          <div class="station-name">

            ${isCurrent ? "📍 " : "🚉 "}

            ${name}

          </div>

          <div class="station-code">
            ${code}
          </div>

          <div class="station-time">

            🕐 Arrival:
            <strong>${formatTime(arrival)}</strong>

            &nbsp;&nbsp;

            🚆 Departure:
            <strong>${formatTime(departure)}</strong>

          </div>

          ${
            status
            ?
            `<div class="station-time">
              Status: ${status}
            </div>`
            :
            ""
          }

        </div>

      `;

    });

  }


  result.innerHTML = `

    <div class="card">

      <div class="train-title">
        🚆 ${trainName}
      </div>

      <div class="train-number">
        Train Number: ${trainNumber}
      </div>


      <div class="status">
        ✅ Live train data received
      </div>


      <div class="info-grid">

        <div class="info">

          <small>📍 Current Station</small>

          <strong>
            ${currentStation}
          </strong>

          ${
            currentCode
            ?
            `<div>${currentCode}</div>`
            :
            ""
          }

        </div>


        <div class="info">

          <small>⏱️ Delay</small>

          <strong class="${Number(delay)>0 ? "delay" : ""}">
            ${delayText}
          </strong>

        </div>

      </div>

    </div>


    ${
      stationsHTML
      ?
      `
      <div class="card">

        <div class="section-title">
          🚉 Route / Station Status
        </div>

        ${stationsHTML}

      </div>
      `
      :
      `
      <div class="card">

        <div class="section-title">
          Route / Station Status
        </div>

        <div class="info">
          Train data successfully received from API.
        </div>

      </div>
      `
    }

  `;

}


function formatTime(value){

  if(!value || value === "-"){
    return "-";
  }


  try{

    const date =
      new Date(value);


    if(!isNaN(date.getTime())){

      return date.toLocaleTimeString(
        "en-IN",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

    }

  }catch(e){}


  return value;

}


/* Enter दबाकर भी Search होगा */

document
  .getElementById("trainNumber")
  .addEventListener(
    "keypress",
    function(event){

      if(event.key === "Enter"){

        searchTrain();

      }

    }
  );

<script>

const API_URL =
"https://railinfohub-api.whitehouse0750.workers.dev/live?train=";


async function searchTrain(){

  const input = document.getElementById("trainNumber");
  const train = input.value.trim();
  const result = document.getElementById("result");

  if(!train){
    result.innerHTML =
      '<div class="error">कृपया ट्रेन नंबर डालें।</div>';
    return;
  }

  result.innerHTML =
    '<div class="card loading">⏳ Live train data लोड हो रहा है...</div>';

  try{

    const response =
      await fetch(API_URL + encodeURIComponent(train));

    if(!response.ok){
      throw new Error("API Error " + response.status);
    }

    const json = await response.json();

    console.log("API DATA:", json);

    if(!json.success || !json.data){
      throw new Error("Train data नहीं मिला");
    }

    displayTrain(json.data);

  }catch(error){

    console.error(error);

    result.innerHTML = `
      <div class="card">
        <div class="error">
          ❌ Live status नहीं मिल पाया।<br><br>
          कृपया थोड़ी देर बाद फिर कोशिश करें।
        </div>
      </div>
    `;
  }
}


function displayTrain(data){

  const result = document.getElementById("result");

  const trainNumber =
    data.trainNumber || "-";

  const trainName =
    data.trainName || "Indian Railway Train";


  /* API में route मौजूद है */

  let route =
    data.route ||
    data.stations ||
    data.stationList ||
    [];


  if(!Array.isArray(route)){
    route = [];
  }


  /*
   Current station निकालना
  */

  let current = null;


  /* पहले halt वाली स्टेशन खोजें */

  current =
    route.find(s =>
      s.isHalt === true &&
      (
        s.status === "arrived" ||
        s.status === "at_station" ||
        s.status === "halt"
      )
    );


  /*
   अगर नहीं मिली तो सबसे आखिरी departed
   स्टेशन लें
  */

  if(!current){

    const departed =
      route.filter(s =>
        s.status === "departed" &&
        (
          s.actualDeparture ||
          s.actualArrival
        )
      );

    if(departed.length){
      current = departed[departed.length - 1];
    }
  }


  /*
   अगर फिर भी नहीं मिली तो
   आखिरी actual station
  */

  if(!current){

    const actual =
      route.filter(s =>
        s.actualArrival ||
        s.actualDeparture
      );

    if(actual.length){
      current = actual[actual.length - 1];
    }
  }


  const currentStation =
    current
      ? (
          current.stationName ||
          current.name ||
          "-"
        )
      : "-";


  const currentCode =
    current
      ? (
          current.stationCode ||
          current.code ||
          ""
        )
      : "";


  /*
   Delay निकालना
  */

  let delay = 0;


  if(current){

    delay =
      Number(current.delayDeparture) ||
      Number(current.delayArrival) ||
      0;
  }


  /* अगर current से delay नहीं मिला */

  if(!delay){

    route.forEach(s => {

      const d =
        Number(s.delayDeparture) ||
        Number(s.delayArrival) ||
        0;

      if(d > delay){
        delay = d;
      }

    });

  }


  let delayText = "On Time";

  if(delay > 0){
    delayText = delay + " min late";
  }


  /*
   Route HTML
  */

  let stationsHTML = "";


  route.forEach((station, index) => {

    const name =
      station.stationName ||
      station.name ||
      "-";


    const code =
      station.stationCode ||
      station.code ||
      "";


    const arrival =
      station.actualArrival ||
      station.scheduledArrival ||
      "-";


    const departure =
      station.actualDeparture ||
      station.scheduledDeparture ||
      "-";


    const stationDelay =
      Number(station.delayDeparture) ||
      Number(station.delayArrival) ||
      0;


    const isCurrent =
      current &&
      (
        name === currentStation ||
        code === currentCode
      );


    let statusText =
      station.status || "";


    if(stationDelay > 0){
      statusText +=
        " • " + stationDelay + " min late";
    }


    stationsHTML += `

      <div class="station ${isCurrent ? "current" : ""}">

        <div class="station-name">

          ${isCurrent ? "📍" : "🚉"}

          ${name}

          ${code ? `(${code})` : ""}

        </div>


        <div class="station-time">

          🕐 Arrival:
          <strong>
            ${formatTime(arrival)}
          </strong>

        </div>


        <div class="station-time">

          🚆 Departure:
          <strong>
            ${formatTime(departure)}
          </strong>

        </div>


        ${
          statusText
          ?
          `
          <div class="station-time">
            ${statusText}
          </div>
          `
          :
          ""
        }

      </div>

    `;

  });


  result.innerHTML = `

    <div class="card">

      <div class="train-title">
        🚆 ${trainName}
      </div>


      <div class="train-number">
        Train Number: ${trainNumber}
      </div>


      <div class="status">
        ✅ Live train data received
      </div>


      <div class="info-grid">

        <div class="info">

          <small>📍 Current Station</small>

          <strong>
            ${currentStation}
          </strong>

          ${
            currentCode
            ?
            `<div>${currentCode}</div>`
            :
            ""
          }

        </div>


        <div class="info">

          <small>⏱️ Delay</small>

          <strong class="${delay > 0 ? "delay" : ""}">
            ${delayText}
          </strong>

        </div>

      </div>

    </div>


    <div class="card">

      <div class="section-title">
        🚉 Route / Station Status
      </div>

      ${
        stationsHTML
        ?
        stationsHTML
        :
        `
        <div class="info">
          Route data उपलब्ध नहीं है।
        </div>
        `
      }

    </div>

  `;

}


function formatTime(value){

  if(!value || value === "-"){
    return "-";
  }


  try{

    const date = new Date(value);

    if(!isNaN(date.getTime())){

      return date.toLocaleTimeString(
        "en-IN",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

    }

  }catch(e){}

  return value;

}


/* Enter दबाने पर Search */

document
  .getElementById("trainNumber")
  .addEventListener(
    "keypress",
    function(event){

      if(event.key === "Enter"){
        searchTrain();
      }

    }
  );

</script>
